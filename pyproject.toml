[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv"
version = "0.1.0"
description = "Prompt Vishwakarma — local-first prompt generation & improvement, driven by Claude Code (key-free)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pv = "pv.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pv.roles.builtin" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
